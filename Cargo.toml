[package]
name = "hecto"
version = "0.1.0"
edition = "2024"
description = "Text Editor Rust practice"
license = "MIT"
repository = "git@github.com:di-rs/hecto.git"
keywords = ["rust", "text-editor"]
categories = ["pratice", "pet"]

[dependencies]
crossterm = "0.29.0"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"      
